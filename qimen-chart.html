<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500&family=MPLUS1Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ── Reset ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Base ── */
  body {
    background: #f5f0e8;
    font-family: "M PLUS Rounded 1c", sans-serif;
  }
  .page {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 10px 12px 32px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* ══════════════════════════════════
     盤頭 Header  (3欄: 50 / 25 / 25)
  ══════════════════════════════════ */
  .header {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    grid-template-rows: auto auto;
    border: 2px solid #111;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    margin-top: 0;
    margin-bottom: 16px;
    width: calc(100% - 12px);
    margin-left: auto;
    margin-right: auto;
  }

  .h-col-left  { grid-column: 1; grid-row: 1; border-right: 1px solid #ddd; padding: 6px 8px; }
  .h-col-mid   { grid-column: 2 / 4; grid-row: 1; padding: 6px 8px; }
  .h-col-combined {
    grid-column: 1 / 4;
    grid-row: 2;
    border-top: 2px solid #111;
    padding: 0;
  }
  .h-col-combined .hc-groups {
    display: grid;
    grid-template-columns: 6fr 5fr 6fr;
    align-items: stretch;
  }
  .h-col-combined .hc-group {
    display: grid;
    align-items: center;
    padding: 6px 6px;
  }
  .h-col-combined .hc-group:not(:first-child) {
    border-left: 1px solid #ddd;
  }
  .h-col-combined .hc-group.g6 { grid-template-columns: repeat(6, 1fr); }
  .h-col-combined .hc-group.g5 { grid-template-columns: repeat(5, 1fr); }
  .h-col-combined .hl {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-size: 11px;
    color: #aaa;
    line-height: 1.3;
  }
  .h-col-combined .hc-pair {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-size: 11px;
    color: #333;
    line-height: 1.3;
  }


  /* table 共用 */
  .h-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .h-table tr { line-height: 1.85; }
  .h-table td {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-size: 11px;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    vertical-align: middle;
  }
  /* 標籤欄（右對齊、灰色） */
  .h-table td.hl {
    color: #aaa;
    text-align: center;
    width: 2.5em;
  }
  /* 內容欄（置中） */
  .h-table td.hv {
    text-align: center;
    padding-left: 0;
    padding-right: 0;
  }

  /* ══════════════════════════════════
     九宮格外層 + 引干
  ══════════════════════════════════ */
  .outer {
    position: relative;
    width: calc(100% - 44px);
    aspect-ratio: 1 / 1;
    margin: 32px auto 20px;
  }

  /* 引干：8個方位 */
  .yigan {
    position: absolute;
    font-size: 15px;
    font-weight: normal;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .yigan-top    { top: -20px; left: 50%; transform: translateX(-50%); }
  .yigan-bottom { bottom: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .yigan-left   { left: -18px; top: 50%; transform: translateY(-50%); flex-direction: column; line-height: 1.2; }
  .yigan-right  { right: -18px; top: 50%; transform: translateY(-50%); flex-direction: column; line-height: 1.2; }
  .yigan-tl { top: -20px; left: -16px; }
  .yigan-tr { top: -20px; right: -16px; }
  .yigan-bl { bottom: -20px; left: -16px; }
  .yigan-br { bottom: -20px; right: -16px; }

  /* ══════════════════════════════════
     九宮 Grid  (3×3 cell wrapper)
  ══════════════════════════════════ */
  .grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    box-sizing: border-box;
    position: relative;
  }

  /* 宮位 wrapper：負責邊框、點擊、高亮 */
  .cell {
    border: 1px solid #999;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    background: #fff;
    cursor: pointer;
    box-sizing: border-box;
    overflow: hidden;
    min-width: 0; min-height: 0;
  }

  /* 外框粗邊 2px + 圓角 */
  .grid .cell:nth-child(1),
  .grid .cell:nth-child(2),
  .grid .cell:nth-child(3) { border-top:    2px solid #111; }
  .grid .cell:nth-child(7),
  .grid .cell:nth-child(8),
  .grid .cell:nth-child(9) { border-bottom: 2px solid #111; }
  .grid .cell:nth-child(1),
  .grid .cell:nth-child(4),
  .grid .cell:nth-child(7) { border-left:   2px solid #111; }
  .grid .cell:nth-child(3),
  .grid .cell:nth-child(6),
  .grid .cell:nth-child(9) { border-right:  2px solid #111; }
  .grid .cell:nth-child(1) { border-radius: 12px 0 0 0; }
  .grid .cell:nth-child(3) { border-radius: 0 12px 0 0; }
  .grid .cell:nth-child(7) { border-radius: 0 0 0 12px; }
  .grid .cell:nth-child(9) { border-radius: 0 0 12px 0; }

  /* 高亮 */
  .cell.highlighted { border-color: #e67e22 !important; background: #fffaf5; }

  /* 每個小格：只畫右邊和下邊 */
  .gc {
    border-top: none;
    border-left: none;
    border-right: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
    background: transparent;
    box-sizing: border-box;
    overflow: hidden;
    min-width: 0; min-height: 0;
  }

  /* 每宮最右欄、最下列不畫線（cell 外框已畫） */
  .gc[style*="grid-column:3;"] { border-right:  none; }
  .gc[style*="grid-row:3;"]    { border-bottom: none; }

  /* 中宮 */
  .cell.center { background: #eeebe3; cursor: default; border: none; }
  /* 中宮小格：全部自己負責四邊；顏色用#ccc（比其他宮位的#ddd深一點），
     因為中宮底色是#eeebe3（比其他宮位的白底#fff深），這樣線在視覺對比上才跟其他宮位一致 */
  .gc-center {
    background: transparent;
    border-top: none;
    border-left: none;
    border-right: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
  }
  /* 每宮最右欄、最下列不畫線（外框已經有線了），寫法比照 .gc */
  .gc-center[style*="grid-column:3;"] { border-right:  none; }
  .gc-center[style*="grid-row:3;"]    { border-bottom: none; }
  /* col1：加左邊（中宮外框左邊） */
  #g5r1c1, #g5r2c1, #g5r3c1 { border-left: 1px solid #999; }
  /* row1：加上邊（中宮外框上邊） */
  #g5r1c1, #g5r1c2, #g5r1c3 { border-top: 1px solid #999; }
  /* col3：右邊（中宮外框右邊） */
  #g5r1c3, #g5r2c3, #g5r3c3 { border-right: 1px solid #999; }
  /* row3：下邊（中宮外框下邊） */
  #g5r3c1, #g5r3c2, #g5r3c3 { border-bottom: 1px solid #999; }
  .tag { font-size: 11px; line-height: 1; margin-top: 1px; }
  .tag.entombed   { color: #999; font-size: 9px; line-height: 1; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); }
  .tag.penalized { color: #c0392b; font-size: 9px; line-height: 1; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); }
  .tag.entombed.has-penalized  { left: 50%; transform: translateX(-100%); }
  .tag.penalized.has-entombed  { left: 50%; transform: translateX(0%); right: auto; }
  .stem-mu  { display: inline-block; position: relative; }
  .stem-char { color: #aaa; }
  .stem-char.penalized { color: #c0392b; }
  .tag.gate-constraint   { color: #c0392b; font-size: 9px; line-height: 1; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); }
  .tag.gate-suppress   { color: #999; font-size: 9px; line-height: 1; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); }
  .tag.void {
    color: #c0392b; font-size: 12px; line-height: 1;
    border: 1px solid #c0392b; border-radius: 50%;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .tag.horse {
    color: #2471a3; font-size: 11px; line-height: 1;
    position: relative; display: inline-flex; align-items: center; justify-content: center;
  }
  .tag.horse::before {
    content: '△';
    font-size: 28px;
    color: #2471a3;
    line-height: 1;
    position: absolute;
  }
  .tag.horse span {
    position: relative; z-index: 1;
    font-size: 9px; margin-top: 5px;
  }
  /* ── 左上格（宮號＋八卦）── */
  .gc-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 3px 1px;
    gap: 2px;
  }
  .house-id { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 2px; }
  .house-num  { font-size: 13px; font-weight: bold; color: #333; line-height: 1.2; font-family: "MPLUS1Code", monospace; }
  .house-name { font-size: 13px; color: #555; line-height: 1.2; }
  .bagua { display: flex; flex-direction: column; gap: 2px; align-items: center; margin-top: 2px; }
  .bline-full { width: 16px; height: 2px; background: var(--line-color, #444); border-radius: 1px; }
  .bline-broken { display: flex; gap: 3px; }
  .bline-broken span { width: 6px; height: 2px; background: var(--line-color, #444); border-radius: 1px; display: block; }

  /* ── 左中（空白）── */
  .gc-left2 {}

  /* ── 左下（馬）── */
  .gc-horse {
    display: flex; flex-direction: row;
    align-items: center; justify-content: center; gap: 1px;
  }

  /* ── 中上（神）── */
  .gc-shen {
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #333;
  }

  /* ── 中中（星）── */
  .gc-star {
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #333; gap: 2px;
  }

  /* ── 中下（門）── */
  .gc-gate {
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #333;
  }

  /* ── 右上（空亡）── */
  .gc-void {
    display: flex; flex-direction: row;
    align-items: center; justify-content: center; gap: 1px;
  }

  /* ── 右中（天盤干）── */
  .gc-tian {
    display: flex; flex-direction: row;
    align-items: center; justify-content: center;
    font-size: 14px; color: #333;
  }

  /* ── 右下（地盤干）── */
  .gc-di {
    display: flex; flex-direction: row;
    align-items: center; justify-content: center;
    font-size: 14px; color: #333;
  }

  /* ── 中宮地支時鐘盤：每宮內部真正的 3x3 小格 ── */
  .dz9 { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width:100%; height:100%; container-type: inline-size; }
  .dz9-cell { display: flex; align-items: center; justify-content: center; overflow: visible; min-width: 0; min-height: 0; }
  .dz9-cell.align-left  { justify-content: flex-start; }
  .dz9-cell.align-right { justify-content: flex-end; }
  .dz9-branch { font-size: 26.7cqi; color: #333; display: inline-block; line-height: 1; white-space: nowrap; }
  .dz9-label { font-size: 26.7cqi; line-height: 1; white-space: nowrap; }
  .dz-center { display: flex; align-items: center; justify-content: center; font-size: 13px; color: #bbb; width:100%; height:100%; cursor: pointer; }
  .compass-ring {
    position: relative;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    transition: transform 0.15s linear;
  }
  .compass-needle {
    position: absolute;
    left: 50%;
    top: 2%;
    bottom: 2%;
    width: 30%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    filter: drop-shadow(0 0 0.5px #999);
  }
  .needle-half {
    flex: 1;
    display: flex;
    justify-content: center;
    box-sizing: border-box;
    font-size: 6px;
    font-weight: 700;
    line-height: 1;
  }
  .needle-s {
    background: #fff;
    color: #333;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    align-items: flex-end;
    padding-bottom: 1px;
  }
  .needle-n {
    background: #c0392b;
    color: #fff;
    clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
    align-items: flex-start;
    padding-top: 1px;
  }

  /* ── 十二長生標籤 ── */
  .dz9-label.stage-mu    { color: #d6408e; }
  .dz9-label.stage-good  { color: #2e7d32; }
  .dz9-label.stage-neutral { color: #999; }
  .stem-active { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 1px; }


    /* ══════════════════════════════════
     輸入區
  ══════════════════════════════════ */
  hr.divider {
    border: none;
    border-top: 1px solid #ddd;
    margin: 16px 0;
  }
  .input-area {
    width: calc(100% - 44px);
    background: #fff;
    border: 1px solid #999;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 0;
    margin-left: auto;
    margin-right: auto;
  }
  .input-title {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 10px;
    text-align: center;
    letter-spacing: 1px;
  }
  .input-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .plate-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .plate-btn {
    flex: 1;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #f5f5f5;
    color: #888;
    font-size: 13px;
    padding: 7px 4px;
    cursor: pointer;
  }
  .plate-btn.active {
    background: #333;
    border-color: #333;
    color: #fff;
  }
  .plate-subtoggle {
    margin-top: -6px;
  }
  .plate-subtoggle .plate-btn {
    font-size: 12px;
    padding: 5px 4px;
    background: #fafafa;
    color: #999;
  }
  .plate-subtoggle .plate-btn.active {
    background: #666;
    border-color: #666;
    color: #fff;
  }
  .input-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .input-row label {
    font-size: 12px;
    color: #aaa;
  }
  .input-row input {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 4px 2px;
    font-size: 16px;
    text-align: center;
    font-family: "MPLUS1Code", monospace;
    color: #333;
    -moz-appearance: textfield;
  }
  .input-row input::-webkit-outer-spin-button,
  .input-row input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .input-row input.input-error {
    border: 1px solid #c0392b;
    background: #fdecea;
  }
  .input-error-msg {
    font-size: 13px;
    color: #c0392b;
    text-align: center;
    margin-top: 8px;
    display: none;
  }
  .input-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .btn-now {
    background: #fff;
    border: 1.5px solid #888;
    border-radius: 6px;
    padding: 8px;
    font-size: 15px;
    font-family: inherit;
    color: #555;
    cursor: pointer;
  }
  .btn-quick {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 8px 0;
    font-size: 13px;
    font-family: inherit;
    color: #666;
    cursor: pointer;
    flex: 1;
    letter-spacing: .05em;
  }
  .btn-quick-row {
    display: flex;
    gap: 8px;
    margin: 10px 0 0;
  }
  .btn-quick-spacer {
    flex: 1;
    visibility: hidden;
    pointer-events: none;
  }
  .btn-start {
    background: #444;
    border: none;
    border-radius: 6px;
    padding: 8px;
    font-size: 15px;
    font-family: inherit;
    color: #fff;
    cursor: pointer;
  }

  /* ── 標題列（標題置中、紀錄按鈕置右） ── */
  .title-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin: 8px 0 12px;
    width: calc(100% - 12px);
    margin-left: auto;
    margin-right: auto;
  }
  .title-row-text {
    grid-column: 2;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #333;
    letter-spacing: 2px;
    white-space: nowrap;
  }

  /* ── 盤面紀錄 ── */
  .btn-records {
    grid-column: 3;
    justify-self: end;
    padding: 5px 12px;
    border: 1px solid #ddd;
    border-radius: 16px;
    background: #fff;
    color: #666;
    font-size: 12px;
    font-family: inherit;
    letter-spacing: .05em;
    cursor: pointer;
  }
  .records-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 100;
  }
  .records-overlay.open { display: block; }
  .records-panel {
    position: absolute;
    top: 0; right: 0;
    width: min(240px, 70vw);
    height: 100%;
    background: #fff;
    box-shadow: -2px 0 10px rgba(0,0,0,.15);
    display: flex;
    flex-direction: column;
    font-size: 14px;
  }
  .records-panel-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid #eee;
    font-weight: bold;
    letter-spacing: .1em;
    color: #333;
  }
  .records-panel-head span {
    grid-column: 2;
    text-align: center;
  }
  .records-panel-close {
    grid-column: 3;
    justify-self: end;
    border: none;
    background: none;
    font-size: 18px;
    color: #999;
    cursor: pointer;
    padding: 0 4px;
  }
  .records-panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 24px;
  }
  .records-section-title {
    font-size: 12px;
    color: #999;
    letter-spacing: .1em;
    margin: 14px 0 6px;
    text-align: center;
  }
  .rec-field { margin-bottom: 10px; }
  .rec-field label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
    text-align: center;
  }
  .rec-field textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 14px;
    font-family: inherit;
    text-align: left;
    resize: vertical;
    min-height: 56px;
  }
  .rec-field textarea::placeholder {
    text-align: center;
  }
  .rec-choice { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .rec-choice button {
    padding: 5px 14px;
    border: 1px solid #ddd;
    border-radius: 16px;
    background: #fff;
    color: #666;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .rec-choice button.active {
    background: #444;
    border-color: #444;
    color: #fff;
  }
  .rec-save-btn {
    width: 100%;
    margin-top: 4px;
    padding: 9px;
    border: none;
    border-radius: 4px;
    background: #444;
    color: #fff;
    font-size: 14px;
    font-family: inherit;

<script>
// ── 入墓判定 ──
const ENTOMBED_TABLE = { '癸':2, '乙':6,'丙':6,'戊':6, '丁':8,'己':8,'庚':8, '辛':4,'壬':4 };

// ── 擊刑判定（六儀天干） ──
// 庚在艮(8)、壬在巽(4) 同時符合入墓與擊刑，兩者皆標記，天干顯示為擊刑紅色
const PENALIZED_TABLE = { '戊':3, '己':2, '庚':8, '辛':9, '壬':4, '癸':4 };

// 渲染天干字串（含寄干），有入墓或擊刑則標記
// isDutyHouse: 此格是否為符頭天干所在宮位（甲入墓判定用，天盤地盤皆適用）
function renderStemHTML(stem, house, dutyStem, isDutyHouse) {
  if (!stem) return '';
  return stem.split('').map(ch => {
    const isPenalized = !!PENALIZED_TABLE[ch] && PENALIZED_TABLE[ch] === house;
    let isEntombed = ENTOMBED_TABLE[ch] === house;
    if (!isEntombed && isDutyHouse && house === 2 && ch === dutyStem) isEntombed = true;

    if (isPenalized || isEntombed) {
      const charClass = isPenalized ? 'stem-char penalized' : 'stem-char';
      const fontSize = (isPenalized && isEntombed) ? '7px' : '9px';
      const muTag   = isEntombed   ? `<span class="tag entombed${isPenalized ? ' has-penalized' : ''}" style="font-size:${fontSize};">墓</span>` : '';
      const xingTag = isPenalized ? `<span class="tag penalized${isEntombed  ? ' has-entombed'  : ''}" style="font-size:${fontSize};">刑</span>` : '';
      return `<span class="stem-mu"><span class="${charClass}">${ch}</span>${muTag}${xingTag}</span>`;
    }
    return `<span>${ch}</span>`;
  }).join('');
}

// ── 十二長生（點擊天盤天干顯示） ──
const CHANGSHENG_STAGE_ORDER = ['長生','沐浴','冠帶','臨官','帝旺','衰','病','死','墓','絕','胎','養'];
const CHANGSHENG_STEM_BRANCHES = {
  '甲': ['亥','子','丑','寅','卯','辰','巳','午','未','申','酉','戌'],
  '乙': ['午','巳','辰','卯','寅','丑','子','亥','戌','酉','申','未'],
  '丙': ['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'],
  '丁': ['酉','申','未','午','巳','辰','卯','寅','丑','子','亥','戌'],
  '戊': ['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'],
  '己': ['酉','申','未','午','巳','辰','卯','寅','丑','子','亥','戌'],
  '庚': ['巳','午','未','申','酉','戌','亥','子','丑','寅','卯','辰'],
  '辛': ['子','亥','戌','酉','申','未','午','巳','辰','卯','寅','丑'],
  '壬': ['申','酉','戌','亥','子','丑','寅','卯','辰','巳','午','未'],
  '癸': ['卯','寅','丑','子','亥','戌','酉','申','未','午','巳','辰'],
};

function changshengStageColorClass(stage) {
  if (stage === '沐浴') return 'stage-mu';
  if (stage === '長生' || stage === '臨官') return 'stage-good';
  return 'stage-neutral';
}

function renderChangsheng(stem) {
  const branches = CHANGSHENG_STEM_BRANCHES[stem];
  if (!branches) return;
  const branchToStage = {};
  branches.forEach((b, i) => { branchToStage[b] = CHANGSHENG_STAGE_ORDER[i]; });
  document.querySelectorAll('.dz9-label[data-dz-label]').forEach(el => {
    const branch = el.dataset.dzLabel;
    const stage = branchToStage[branch] || '';
    el.textContent = stage;
    el.classList.remove('stage-mu', 'stage-good', 'stage-neutral');
    if (stage) el.classList.add(changshengStageColorClass(stage));
  });
}

function clearChangsheng() {
  document.querySelectorAll('.dz9-label[data-dz-label]').forEach(el => {
    el.textContent = '';
    el.classList.remove('stage-mu', 'stage-good', 'stage-neutral');

}

// 取得該宮位可觸發十二長生的候選清單：天盤天干（寄干則有兩個，左→右）→ 值符（若本宮為值符宮，代表甲）
function getHouseChangshengCandidates(cellEl) {
  const candidates = [];
  const tianContainer = cellEl.querySelector('.gc-tian');
  if (tianContainer) {
    const tianEl = tianContainer.querySelector('[id^="tian-"]') || tianContainer;
    const wrapperSpans = [...tianEl.querySelectorAll(':scope > span')];
    wrapperSpans.forEach(w => {
      const span = w.classList.contains('stem-mu') ? (w.querySelector('.stem-char') || w) : w;
      if (!span || span.classList.contains('tag')) return;
      const stem = (span.textContent || '').trim();
      if (stem && CHANGSHENG_STEM_BRANCHES[stem]) {
        candidates.push({ span, stem });
      }
    });
  }
  const shenContainer = cellEl.querySelector('.gc-shen');
  if (shenContainer) {
    const shenSpan = shenContainer.querySelector('span');
    if (shenSpan && (shenSpan.textContent || '').trim() === '值符') {
      candidates.push({ span: shenSpan, stem: '甲' });
    }
  }
  return candidates;
}

// ── 指南針（中5宮正中央格）──
(function() {
  const compassCell = document.getElementById('compassCell');
  const compassRing = document.getElementById('compassRing');
  if (!compassCell || !compassRing) return;

  let compassActive = false;

  function applyHeading(heading) {
    // 排盤圖是離9(南)在上方，不是一般地圖的北在上方，所以這裡要對準「南」而非「北」
    const southHeading = (heading + 180) % 360;
    compassRing.style.transform = `rotate(${-southHeading}deg)`;
  }

  function handleOrientation(e) {
    let heading = null;
    if (typeof e.webkitCompassHeading === 'number') {
      // iOS：webkitCompassHeading 已經是真實方位角，數值越準確
      heading = e.webkitCompassHeading;
    } else if (e.alpha !== null && e.alpha !== undefined) {
      // Android：alpha 為裝置朝向與磁北的夾角，近似換算
      heading = 360 - e.alpha;
    }
    if (heading !== null) applyHeading(heading);
  }

  function startCompass() {
    if (compassActive) return;
    compassActive = true;
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);
  }

  compassCell.addEventListener('click', function() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function(state) {
        if (state === 'granted') {
          startCompass();
        } else {
          alert('未取得方向感測器權限，指南針無法使用。');
        }
      }).catch(function(err) {
        alert('無法啟用指南針：' + err.message);
      });
    } else if (typeof DeviceOrientationEvent !== 'undefined') {
      // Android 等不需要額外授權的瀏覽器
      startCompass();
    } else {
      alert('此裝置或瀏覽器不支援方向感測器。');
    }
  });
})();

// ── 門迫判定 ──
const GATE_CONSTRAINT_TABLE = {
  '休門': [9],
  '生門': [1],
  '傷門': [2, 8],
  '杜門': [2, 8],
  '景門': [6, 7],
  '死門': [1],
  '驚門': [3, 4],
  '開門': [3, 4],
};
// ── 制判定（宮剋門，跟門迫相反的方向：宮的五行反過來剋制門）──
// 僅限年家（年盤）套用；不算四害，純視覺標示，顏色比照「墓」字淡化處理。
const GATE_SUPPRESS_TABLE = {
  '休門': [2, 8],
  '生門': [3, 4],
  '傷門': [6, 7],
  '杜門': [6, 7],
  '景門': [1],
  '死門': [3, 4],
  '驚門': [9],
  '開門': [9],
};

function renderGateHTML(gate, house) {
  if (!gate) return '';
  const constraintHouses = GATE_CONSTRAINT_TABLE[gate] || [];
  if (constraintHouses.includes(house)) {
    return `<span style="position:relative;display:inline-block;color:#c0392b;">${gate}<span class="tag gate-constraint">迫</span></span>`;
  }
  if (PLATE_MODE === 'yang' && PLATE_SUBMODE === 'year') {
    const suppressHouses = GATE_SUPPRESS_TABLE[gate] || [];
    if (suppressHouses.includes(house)) {
      return `<span style="position:relative;display:inline-block;">${gate}<span class="tag gate-suppress">制</span></span>`;
    }
  }
  return gate;
}

function getInputDate() {
  const y = parseInt(document.getElementById('year').value) || 0;
  const m = parseInt(document.getElementById('month').value) || 1;
  const d = parseInt(document.getElementById('day').value) || 1;
  const h = parseInt(document.getElementById('hour').value) || 0;
  const mn = parseInt(document.getElementById('minute').value) || 0;
  return new Date(y, m - 1, d, h, mn);
}

function setInputDate(dt) {
  document.getElementById('year').value = dt.getFullYear();
  document.getElementById('month').value = pad(dt.getMonth() + 1);
  document.getElementById('day').value = pad(dt.getDate());
  document.getElementById('hour').value = pad(dt.getHours());
  document.getElementById('minute').value = pad(dt.getMinutes());
}

function shiftDate(days) {
  const dt = getInputDate();
  dt.setDate(dt.getDate() + days);
  setInputDate(dt);
  castChart();
}

function shiftHour(hours) {
  const dt = getInputDate();
  dt.setHours(dt.getHours() + hours);
  setInputDate(dt);
  castChart();
}

function shiftMonth(months) {
  const dt = getInputDate();
  dt.setMonth(dt.getMonth() + months);
  setInputDate(dt);
  castChart();
}

function shiftYear(years) {
  const dt = getInputDate();
  dt.setFullYear(dt.getFullYear() + years);
  setInputDate(dt);
  castChart();
}

// 快捷鍵按鈕組：依當前盤別／子模式切換對應的時間跳轉單位
// 陰盤／陽盤時盤：前日／次日／上時／下時（沿用原本行為）
// 陽盤日盤：上日／次日（日盤只看日干支，時分不影響結果，不需要上時/下時）
// 陽盤月盤：上月／次月（比照tzchimen月家的「上月/次月」設計）
// 陽盤年盤：去年／次年（比照tzchimen年家的「去年/次年」設計）
function updateQuickNav() {
  const row = document.getElementById('btn-quick-row');
  if (!row) return;
  let html;
  if (PLATE_MODE === 'yang' && PLATE_SUBMODE === 'year') {
    html = `
      <button class="btn-quick" onclick="shiftYear(-1)">去年</button>
      <div class="btn-quick-spacer"></div>
      <div class="btn-quick-spacer"></div>
      <button class="btn-quick" onclick="shiftYear(+1)">次年</button>
    `;
  } else if (PLATE_MODE === 'yang' && PLATE_SUBMODE === 'month') {
    html = `
      <button class="btn-quick" onclick="shiftMonth(-1)">上月</button>
      <div class="btn-quick-spacer"></div>
      <div class="btn-quick-spacer"></div>
      <button class="btn-quick" onclick="shiftMonth(+1)">次月</button>
    `;
  } else if (PLATE_MODE === 'yang' && PLATE_SUBMODE === 'day') {
    html = `
      <button class="btn-quick" onclick="shiftDate(-1)">上日</button>
      <div class="btn-quick-spacer"></div>
      <div class="btn-quick-spacer"></div>
      <button class="btn-quick" onclick="shiftDate(+1)">次日</button>
    `;
  } else {
    html = `
      <button class="btn-quick" onclick="shiftDate(-1)">前日</button>
      <button class="btn-quick" onclick="shiftHour(-2)">上時</button>
      <button class="btn-quick" onclick="shiftHour(+2)">下時</button>
      <button class="btn-quick" onclick="shiftDate(+1)">次日</button>
    `;
  }
  row.innerHTML = html;
}

// 宮位 → 中宮對應小格 id
const HOUSE_TO_DZ_CELL = {
  4: 'g5r1c1', 9: 'g5r1c2', 2: 'g5r1c3',
  3: 'g5r2c1',              7: 'g5r2c3',
  8: 'g5r3c1', 1: 'g5r3c2', 6: 'g5r3c3',
};

let _houseCells = null;
function getHouseCells() {
  if (!_houseCells) _houseCells = [...document.querySelectorAll('.grid .cell')];
  return _houseCells;
}

function clearHighlight() {
  getHouseCells().forEach(c => {
    c.classList.remove('highlighted');
    c.style.borderTopColor = c.style.borderBottomColor =
    c.style.borderLeftColor = c.style.borderRightColor = '';
  });
  // 清除中宮小格邊框
  document.querySelectorAll('.gc-center').forEach(gc => {
    gc.style.borderTopColor = gc.style.borderLeftColor =
    gc.style.borderRightColor = gc.style.borderBottomColor = '';
  });
}

function applyHouseHighlight(cellEl) {
  const cells = getHouseCells();
  const nth = cells.indexOf(cellEl) + 1;
  if (nth === 0) return;
  cellEl.classList.add('highlighted');
  cellEl.style.borderTopColor = cellEl.style.borderBottomColor =
  cellEl.style.borderLeftColor = cellEl.style.borderRightColor = HIGHLIGHT_COLOR;

  // 右側相鄰格左邊改橘
  const r = HOUSE_NEIGHBORS[nth]?.right;
  if (r) cells[r-1].style.borderLeftColor = HIGHLIGHT_COLOR;
  // 下側相鄰格上邊改橘
  const b = HOUSE_NEIGHBORS[nth]?.bottom;
  if (b) cells[b-1].style.borderTopColor = HIGHLIGHT_COLOR;
  // 左側相鄰格右邊改橘
  const lk = HOUSE_LEFT[nth];
  if (lk) cells[lk-1].style.borderRightColor = HIGHLIGHT_COLOR;
  // 上側相鄰格下邊改橘
  const tk = HOUSE_TOP[nth];
  if (tk) cells[tk-1].style.borderBottomColor = HIGHLIGHT_COLOR;

  // 中宮對應地支格：改四邊顏色
  const gong = parseInt(cellEl.dataset.gong);
  const dzId = HOUSE_TO_DZ_CELL[gong];
  if (dzId) {
    const gc = document.getElementById(dzId);
    if (!gc) return;
    const row = parseInt(dzId[3]);
    const col = parseInt(dzId[5]);

    // right / bottom：直接改自身
    gc.style.borderRightColor  = HIGHLIGHT_COLOR;
    gc.style.borderBottomColor = HIGHLIGHT_COLOR;

    // top：row1 改自身 top（外框邊）；row2/3 改上方格 bottom
    if (row === 1) {
      gc.style.borderTopColor = HIGHLIGHT_COLOR;
    } else {
      document.getElementById(`g5r${row-1}c${col}`).style.borderBottomColor = HIGHLIGHT_COLOR;
    }

    // left：col1 改自身 left（外框邊）；col2/3 改左方格 right
    if (col === 1) {
      gc.style.borderLeftColor = HIGHLIGHT_COLOR;
    } else {
      document.getElementById(`g5r${row}c${col-1}`).style.borderRightColor = HIGHLIGHT_COLOR;
    }
  }
}

document.querySelectorAll('.cell[data-gong]').forEach(cell => {
  cell.addEventListener('click', function() {
    const candidates = getHouseChangshengCandidates(this);
    if (candidates.length === 0) return;

    const sameHouse = (_activeChangshengHouse === this);
    let nextIndex;
    if (!sameHouse) {
      nextIndex = 0;
    } else if (_activeChangshengIndex === candidates.length - 1) {
      nextIndex = -1;
    } else {
      nextIndex = _activeChangshengIndex + 1;
    }

    document.querySelectorAll('.gc-tian .stem-active, .gc-shen .stem-active').forEach(s => s.classList.remove('stem-active'));
    clearHighlight();
    clearChangsheng();

    if (nextIndex === -1) {
      _activeChangshengHouse = null;
      _activeChangshengIndex = -1;
      return;
    }

    const chosen = candidates[nextIndex];
    chosen.span.classList.add('stem-active');
    renderChangsheng(chosen.stem);
    applyHouseHighlight(this);
    _activeChangshengHouse = this;
    _activeChangshengIndex = nextIndex;
  });
});

// 自動跳格
const INPUT_ORDER = ['year','month','day','hour','minute'];
const INPUT_MAXLEN = { year:4, month:2, day:2, hour:2, minute:2 };

INPUT_ORDER.forEach((id, idx) => {
  const el = document.getElementById(id);
  el.addEventListener('input', function() {
    // 只保留數字
    this.value = this.value.replace(/\D/g, '');
    if (this.value.length >= INPUT_MAXLEN[id]) {
      const next = INPUT_ORDER[idx + 1];
      if (next) document.getElementById(next).focus();
    }
  });
  el.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && this.value === '') {
      const prev = INPUT_ORDER[idx - 1];
      if (prev) {
        const prevEl = document.getElementById(prev);
        prevEl.focus();
        // 游標移到末位
        const len = prevEl.value.length;
        prevEl.setSelectionRange(len, len);
      }
    }
  });
});

// ==================== 陽盤時家置閏法引擎 ====================
// 移植自「奇門曆引擎」工具，錨點 1899-12-22 甲子日 冬至 陽一局 正授（已多來源交叉驗證）
// 僅負責算「局數＋陰陽遁」，其餘排盤步驟（值符值使、八神八星八門、引干、四害）與陰盤共用，不受影響

const YANG_CYCLE_TRAD = ['冬至','小寒','大寒','立春','雨水','驚蟄','春分','清明','穀雨','立夏','小滿','芒種','夏至','小暑','大暑','立秋','處暑','白露','秋分','寒露','霜降','立冬','小雪','大雪'];
const YANG_CYCLE_SIMP = ['冬至','小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪'];
const YANG_JU_TABLE = {
  "冬至":{"dun":"陽遁","shang":1,"zhong":7,"xia":4},"小寒":{"dun":"陽遁","shang":2,"zhong":8,"xia":5},
  "大寒":{"dun":"陽遁","shang":3,"zhong":9,"xia":6},"立春":{"dun":"陽遁","shang":8,"zhong":5,"xia":2},
  "雨水":{"dun":"陽遁","shang":9,"zhong":6,"xia":3},"驚蟄":{"dun":"陽遁","shang":1,"zhong":7,"xia":4},
  "春分":{"dun":"陽遁","shang":3,"zhong":9,"xia":6},"清明":{"dun":"陽遁","shang":4,"zhong":1,"xia":7},
  "穀雨":{"dun":"陽遁","shang":5,"zhong":2,"xia":8},"立夏":{"dun":"陽遁","shang":4,"zhong":1,"xia":7},
  "小滿":{"dun":"陽遁","shang":5,"zhong":2,"xia":8},"芒種":{"dun":"陽遁","shang":6,"zhong":3,"xia":9},
  "夏至":{"dun":"陰遁","shang":9,"zhong":3,"xia":6},"小暑":{"dun":"陰遁","shang":8,"zhong":2,"xia":5},
  "大暑":{"dun":"陰遁","shang":7,"zhong":1,"xia":4},"立秋":{"dun":"陰遁","shang":2,"zhong":5,"xia":8},
  "處暑":{"dun":"陰遁","shang":1,"zhong":4,"xia":7},"白露":{"dun":"陰遁","shang":9,"zhong":3,"xia":6},
  "秋分":{"dun":"陰遁","shang":7,"zhong":1,"xia":4},"寒露":{"dun":"陰遁","shang":6,"zhong":9,"xia":3},
  "霜降":{"dun":"陰遁","shang":5,"zhong":8,"xia":2},"立冬":{"dun":"陰遁","shang":6,"zhong":9,"xia":3},
  "小雪":{"dun":"陰遁","shang":5,"zhong":8,"xia":1},"大雪":{"dun":"陰遁","shang":4,"zhong":7,"xia":1}
};
const YANG_ANCHOR = new Date(Date.UTC(1899,11,22)); // 1899-12-22 甲子日 冬至 陽一局 正授
const YANG_ANCHOR_INDEX = 0; // 冬至

let _yangJieQiTableCache = {};
function _yangParseSolarToDate(solarObj){
  const s = solarObj.toYmdHms();
  const m = s.match(/(\d+)-(\d+)-(\d+)\s+(\d+):(\d+):(\d+)/);
  return new Date(Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]));
}
function _yangLoadJieQiTableForYear(y){
  if (_yangJieQiTableCache[y]) return _yangJieQiTableCache[y];
  const lunar = Lunar.fromYmd(y, 6, 15);
  const raw = lunar.getJieQiTable();
  const table = {};
  for (const name in raw) {
    if (raw.hasOwnProperty(name)) table[name] = _yangParseSolarToDate(raw[name]);
  }
  _yangJieQiTableCache[y] = table;
  return table;
}
function _yangGetRealJieqiDate(cycleIndex, nearDate){
  const simpName = YANG_CYCLE_SIMP[cycleIndex];
  const y = nearDate.getUTCFullYear();
  let best = null, bestDist = Infinity;
  [y-1, y, y+1].forEach(yr => {
    const table = _yangLoadJieQiTableForYear(yr);
    if (table[simpName]) {
      const dist = Math.abs(table[simpName].getTime() - nearDate.getTime());
      if (dist < bestDist) { bestDist = dist; best = table[simpName]; }
    }
  });
  return best;
}
function _yangDateOnly(d){ return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
function _yangDayDiff(a,b){ return Math.round((_yangDateOnly(a).getTime()-_yangDateOnly(b).getTime())/86400000); }
function _yangAddDays(d,n){ return new Date(d.getTime()+n*86400000); }

let _yangSimCache = [];
let _yangSimCacheEndsAt = null;
let _yangSimCursorIndex = YANG_ANCHOR_INDEX;
let _yangSimCursorDate = YANG_ANCHOR;

function _yangStepOnce(){
  const jieqi = YANG_CYCLE_TRAD[_yangSimCursorIndex];
  const jt = YANG_JU_TABLE[jieqi];
  const real = _yangGetRealJieqiDate(_yangSimCursorIndex, _yangSimCursorDate);
  const diffDays = real ? _yangDayDiff(real, _yangSimCursorDate) : null;
  const isTrigger = (jieqi === '大雪' || jieqi === '芒種') && diffDays !== null && diffDays >= 9;
  const row = {
    date: _yangSimCursorDate, jieqi, dun: jt.dun,
    shang: jt.shang, zhong: jt.zhong, xia: jt.xia,
    actual: real, diffDays, zhiRun: isTrigger
  };
  _yangSimCache.push(row);
  _yangSimCursorDate = _yangAddDays(_yangSimCursorDate, 15);
  if (!isTrigger) _yangSimCursorIndex = (_yangSimCursorIndex + 1) % 24;
  _yangSimCacheEndsAt = _yangSimCursorDate;
  return row;
}
function _yangEnsureSimulatedUntil(targetDate){
  let guard = 0;
  while ((_yangSimCacheEndsAt === null || _yangSimCacheEndsAt <= targetDate) && guard < 20000) {
    _yangStepOnce();
    guard++;
  }
}
function _yangFindRowForDate(targetDate){
  _yangEnsureSimulatedUntil(targetDate);
  let idx = -1;
  for (let i = 0; i < _yangSimCache.length; i++) {
    if (_yangSimCache[i].date.getTime() <= targetDate.getTime()) idx = i; else break;
  }
  return idx >= 0 ? _yangSimCache[idx] : null;
}

// 陽盤局數（僅看日期，跟時分無關；子時跨日等細節不適用，因局數以15天為粒度）
// 回傳 { solsticeType:'陽'|'陰', chartNum:1-9, row } 供 castChart() 使用
function getYangChartNumber(y, m, d) {
  const target = new Date(Date.UTC(y, m - 1, d));
  if (target.getTime() < YANG_ANCHOR.getTime()) return null; // 早於已驗證錨點範圍
  const row = _yangFindRowForDate(target);
  if (!row) return null;
  const offset = _yangDayDiff(target, row.date);
  let yuanKey;
  if (offset <= 4) yuanKey = 'shang';
  else if (offset <= 9) yuanKey = 'zhong';
  else yuanKey = 'xia';
  return {
    solsticeType: row.dun === '陽遁' ? '陽' : '陰',
    chartNum: row[yuanKey],
    jieqi: row.jieqi,
    zhiRun: row.zhiRun,
    row
  };
}

// 年盤專用：三元甲子局數表
// 套用玄空飛星「三元甲子」的60年區塊，每180年循環：
//   上元：1864起 → 陰1局；中元：1924起 → 陰4局；下元：1984起 → 陰7局
// 換元邊界為立春（如1984/2/4癸亥年中元陰4局 → 1984/2/5甲子年下元陰7局），
// 與排盤規則.md「年支須用節氣換年」原則一致，故效力年份（effectiveYear）採用八字年柱
// 干支反推，不用西元曆年或農曆正月初一。陰陽遁固定為陰遁。
const SAN_YUAN_ANCHOR_YEAR = 1864; // 上元起始年（甲子，以立春為界）
const SAN_YUAN_JU_BY_YUAN = [1, 4, 7]; // [上元, 中元, 下元] 對應局數
function getEffectiveYearFromGanZhi(y, yearGZ) {
  // 由西元年反推「立春校正後」的年份：year本身的干支已由 eightChar（含立春校正）算出，
  // 這裡只是找出與該干支相符、且落在 y 附近（y-1／y／y+1）的西元年整數，供三元表查詢用
  const stemIdx = HEAVEN_STEM_LIST.indexOf(yearGZ[0]);
  const branchIdx = EARTH_BRANCH_LIST.indexOf(yearGZ[1]);
  for (const cand of [y, y - 1, y + 1]) {
    const s = ((cand - 4) % 10 + 10) % 10;
    const b = ((cand - 4) % 12 + 12) % 12;
    if (s === stemIdx && b === branchIdx) return cand;
  }
  return y; // 理論上不會走到這裡，僅防呆
}
// 已驗證範圍：1800年起。1800年以前公式仍會照常計算（純mod 180運算，
// 跟時家（置閏）那種鏈式模擬不同，沒有方向性限制），但缺乏比對資料，故標示為「未驗證外推」而非直接擋下。
const SAN_YUAN_VERIFIED_FROM_YEAR = 1800;
function getYearSanYuanJu(y, m, d, yearGZ) {
  const effectiveYear = getEffectiveYearFromGanZhi(y, yearGZ);
  const offset = ((effectiveYear - SAN_YUAN_ANCHOR_YEAR) % 180 + 180) % 180;
  const yuanIndex = Math.floor(offset / 60); // 0=上元, 1=中元, 2=下元
  return {
    solsticeType: '陰',
    chartNum: SAN_YUAN_JU_BY_YUAN[yuanIndex],
    yuanName: ['上元', '中元', '下元'][yuanIndex],
    effectiveYear,
    isVerified: effectiveYear >= SAN_YUAN_VERIFIED_FROM_YEAR
  };
}
// 月盤專用：跟年盤同一套「三元甲子」邏輯，只是週期縮小為5年一區塊、15年一循環
// 月盤實際運作更接近年盤的縮小版：60個月＝5年（跟年干支60甲子循環一樣是精確離散系統，不套用會浮動
// 的節氣連續量），故不需要時家（置閏）那套超神接氣、大雪/芒種置閏機制。effectiveYear沿用同一套立春校正反推
// （見getEffectiveYearFromGanZhi），局數對照表也跟年盤共用同一張[1,4,7]，已驗證範圍同年盤沿用
// SAN_YUAN_VERIFIED_FROM_YEAR（1800年起）。
function getMonthWuXingJu(y, m, d, yearGZ) {
  const effectiveYear = getEffectiveYearFromGanZhi(y, yearGZ);
  const offset = ((effectiveYear - SAN_YUAN_ANCHOR_YEAR) % 15 + 15) % 15;
  const blockIndex = Math.floor(offset / 5); // 0=上元, 1=中元, 2=下元（5年一區塊）
  return {
    solsticeType: '陰',
    chartNum: SAN_YUAN_JU_BY_YUAN[blockIndex],
    yuanName: ['上元', '中元', '下元'][blockIndex],
    effectiveYear,
    isVerified: effectiveYear >= SAN_YUAN_VERIFIED_FROM_YEAR
  };
}
// ⚠️ 日盤實驗性公式（尚無任何實測資料驗證，不接入 castChart 正式流程）
// 推導邏輯：日柱跟月柱、年柱一樣是精確的60甲子離散循環，60天剛好等於日柱自己完整跑一輪甲子，
// 比照月盤／年盤「1局＝該干支的一輪甲子循環長度」這條結構性規律，日盤應該是「60天一局、180天三元一輪」，
// 局數表沿用同一張[1,4,7]。陰陽遁借用時家（置閏）的判定（純粹看真實節氣落在冬至→芒種
// 或夏至→大雪哪一半年，不涉及置閏鏈式模擬本身要查的局數，只借用 solsticeType 這個欄位）。
// 已知風險：
// 1. 60天一區塊的「錨點日期」（哪一天是上元的第一天）完全沒有驗證資料，此處故意留白（anchorDateStr
//    不傳時只回傳陰陽遁，chartNum為null），需要至少一組日盤實測資料（起局＋畫面上的上/中/下元標籤）
//    才能反推出正確錨點，反推方式跟年盤/月盤那次相同。
// 2. 陰陽遁borrow時家（置閏）判定這件事本身也還沒驗證，只是邏輯上比「強制陰遁」更說得通，需要實測資料佐證。
function getDayWuXingJuTrial(y, m, d, anchorDateStr) {
  const dunInfo = getYangChartNumber(y, m, d); // 借用時家（置閏）的陰陽遁判定（節氣冬至/夏至半年切分）
  const solsticeType = dunInfo ? dunInfo.solsticeType : null;
  if (!anchorDateStr) {
    return {
      solsticeType,
      chartNum: null,
      _pendingAnchor: true,
      _note: '骨架已完成（60天一局/180天三元，局數表沿用[1,4,7]），錨點日期尚未驗證。' +
             '拿到第一組日盤實測資料後，呼叫本函式時傳入候選錨點日期字串（如"1864-01-01"，格式YYYY-MM-DD），比對結果反推出正確錨點。'
    };
  }
  const anchor = new Date(anchorDateStr + 'T00:00:00Z');
  const target = new Date(Date.UTC(y, m - 1, d));
  const diffDays = Math.round((target - anchor) / 86400000);
  const offset = ((diffDays % 180) + 180) % 180;
  const blockIndex = Math.floor(offset / 60); // 0=上元, 1=中元, 2=下元（60天一區塊）
  return {
    solsticeType,
    chartNum: SAN_YUAN_JU_BY_YUAN[blockIndex],
    yuanName: ['上元', '中元', '下元'][blockIndex],
    _experimental: true,
    _note: '未經實測驗證，僅供對照，不接入正式日盤流程'
  };
}

// 地支序數
const EARTH_BRANCH_LIST = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

// 數字根（各位數相加到一位數，0視為9）
function digitalRoot(n) {
  while (n > 9) {
    n = String(n).split('').reduce((a, b) => a + parseInt(b), 0);
  }
  return n === 0 ? 9 : n;
}

// 取時辰地支
function hourToBranch(h) {
  // 子=23-1, 丑=1-3, ..., 亥=21-23
  const idx = Math.floor((h + 1) / 2) % 12;
  return EARTH_BRANCH_LIST[idx];
}

// 判斷陰陽遁：找開盤時間前最近的冬至或夏至
function getSolsticeType(y, m, d, h) {
  const openDate = new Date(y, m-1, d, h);

  // 搜尋前兩年到當年的節氣，找最近一個冬至或夏至的名稱
  let lastSolstice = null;

  for (let yr = y - 1; yr <= y; yr++) {
    const lunarYr = LunarYear.fromYear(yr);
    const jieQiDays = lunarYr.getJieQiJulianDays();

    // lunar-javascript 節氣順序固定，冬至是第0個，夏至是第12個（從冬至開始算）
    // 用 Solar.fromJulianDay 取得日期，再用 getLunar().getJieQi() 確認名稱
    for (let i = 0; i < jieQiDays.length; i++) {
      const s = Solar.fromJulianDay(jieQiDays[i]);
      const name = s.getLunar().getJieQi();
      if (name === '冬至' || name === '夏至') {
        const sDate = new Date(s.getYear(), s.getMonth()-1, s.getDay());
        if (sDate <= openDate) lastSolstice = name;
      }
    }
  }

  return lastSolstice === '冬至' ? '陽' : '陰';
}

// 計算局數
function getChartNumber(lunar, h, ec) {
  const yearBranch = ec.getYear()[1];       // 年支（節氣換年，取四柱年柱地支）
  const lunarMonth = Math.abs(lunar.getMonth()); // 農曆月
  const lunarDay = lunar.getDay();       // 農曆日
  const hourBranch = hourToBranch(h);         // 時支

  const yearBranchIdx = EARTH_BRANCH_LIST.indexOf(yearBranch) + 1;
  const hourBranchIdx = EARTH_BRANCH_LIST.indexOf(hourBranch) + 1;

  const sum = yearBranchIdx + lunarMonth + lunarDay + hourBranchIdx;
  return digitalRoot(sum);
}

// 實際順時針／逆時針（八神、八星、天盤天干、引干用）
const HOUSE_CW  = [1, 8, 3, 4, 9, 2, 7, 6]; // 順時針
const HOUSE_CCW = [1, 6, 7, 2, 9, 4, 3, 8]; // 逆時針

// 共用：從 startHouse 起，沿 order 方向，把 items 陣列從 headIdx 偏移開始依序放入8個宮位
// （八神、八星、天盤天干、引干普通法，皆為同一種「起點+方向+固定序列+偏移」的放置模式）
function placeInOrder(startHouse, order, items, headIdx = 0) {
  const startIdx = order.indexOf(parseInt(startHouse));
  const result = {};
  for (let i = 0; i < 8; i++) {
    result[order[(startIdx + i) % 8]] = items[(headIdx + i) % 8];
  }
  return result;
}

// 六儀三奇順序
const EARTH_STEM_ORDER = ['戊','己','庚','辛','壬','癸','丁','丙','乙'];

// 九宮完整順序（含5，供路中判斷用）
const HOUSE_FLY_ASC  = [1, 2, 3, 4, 5, 6, 7, 8, 9]; // 順時針含中宮
const HOUSE_FLY_DESC = [9, 8, 7, 6, 5, 4, 3, 2, 1]; // 逆時針含中宮

// 地盤固定對應：宮位→九星名稱、八門名稱
const HOUSE_STAR = { 1:'天蓬', 2:'天芮', 3:'天沖', 4:'天輔', 6:'天心', 7:'天柱', 8:'天任', 9:'天英' };
const HOUSE_GATE  = { 1:'休門', 2:'死門', 3:'傷門', 4:'杜門', 6:'開門', 7:'驚門', 8:'生門', 9:'景門' };

// 八神固定順序
const EIGHT_SPIRITS = ['值符','騰蛇','太陰','六合','白虎','玄武','九地','九天'];

// 排八神：時天干宮起，陽遁實際順時針，陰遁實際逆時針
function getSpiritMap(timeStemHouse, solsticeType) {
  const order = solsticeType === '陽' ? HOUSE_CW : HOUSE_CCW;
  return placeInOrder(timeStemHouse, order, EIGHT_SPIRITS);
}

// 地支→宮位對應表
const BRANCH_TO_HOUSE = {
  '子':1, '丑':8, '寅':8, '卯':3, '辰':4, '巳':4,
  '午':9, '未':2, '申':2, '酉':7, '戌':6, '亥':6
};

// 宮位→地支對應表（由 BRANCH_TO_HOUSE 反推）
const HOUSE_DZ = (() => {
  const map = {};
  Object.entries(BRANCH_TO_HOUSE).forEach(([dz, gong]) => {
    if (!map[gong]) map[gong] = [];
    map[gong].push(dz);
  });
  return map;
})();

// 馬星：時辰地支→馬星地支
const TRAVEL_HORSE_TABLE = {
  '申':'寅', '子':'寅', '辰':'寅',
  '寅':'申', '午':'申', '戌':'申',
  '巳':'亥', '酉':'亥', '丑':'亥',
  '亥':'巳', '卯':'巳', '未':'巳'
};

// 時干序數
const EIGHT_GATES = ['休門','生門','傷門','杜門','景門','死門','驚門','開門'];

// 地盤宮位→八門 index（對應 EIGHT_GATES）
const HOUSE_GATE_IDX = { 1:0, 2:5, 3:2, 4:3, 6:7, 7:6, 8:1, 9:4 };

// 時干序數
const HEAVEN_STEM_LIST = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];

// 排八門：從地盤值使門宮位走步，落點放值使門，其餘實際順時針放入
function getGateMap(dutyGateHouse, solsticeType, timeStem) {
  dutyGateHouse = parseInt(dutyGateHouse);
  // 時干序數（甲=1…癸=10），起點算第一步，所以走 steps-1 步
  const steps = HEAVEN_STEM_LIST.indexOf(timeStem) + 1;
  // 走步用含中宮的九宮數字順序（中宮5為獨立計數站，不可提前併入坤2）
  const walkOrder = solsticeType === '陽' ? HOUSE_FLY_ASC : HOUSE_FLY_DESC;
  const startIdx = walkOrder.indexOf(dutyGateHouse);
  // 走 steps-1 步（起點算第一步）
  let landGong = walkOrder[(startIdx + steps - 1) % 9];
  // 入中寄坤
  if (landGong === 5) landGong = 2;

  // 值使門的門名 index（中宮無門，查表時用寄坤後的2）
  const shimenMenIdx = HOUSE_GATE_IDX[dutyGateHouse === 5 ? 2 : dutyGateHouse];

  // 從落點起，實際順時針放入八門
  const landIdx = HOUSE_CW.indexOf(landGong);
  const result = {};
  for (let i = 0; i < 8; i++) {
    const gong = HOUSE_CW[(landIdx + i) % 8];
    result[gong] = EIGHT_GATES[(shimenMenIdx + i) % 8];
  }
  return result;
}

// 排引干：值使門落宮起，時天干為頭，沿地盤實際順時針序列切入，永遠順時針放入
// 星伏／門伏：純位置標記（八星/八門是否全部回到固定本宮），畫面顯示用，跟特例三觸發邏輯分開
// 特例三/四觸發前提：① 星伏（isStarFrozen）② 引干閉環（isGuidingClosed，值使門落宮地盤干含effectiveStem）
// 兩個觸發條件都成立才飛布；星伏/門伏的「位置」標記本身不直接決定要不要飛布
// earthStemSeq：實際順時針讀出的地盤天干序列（8個位置，由呼叫端算好傳入，避免與getHeavenStemMap重複計算）
function getHidingStemMap(dutyGateLandHouse, earthStemMap, earthStemSeq, timeStem, dutyStem, solsticeType, timeStemHouse, dutyStemHouse) {
  dutyGateLandHouse = parseInt(dutyGateLandHouse);

  // 決定實際使用的時干（甲不在地盤時改用符頭）
  const effectiveStem = (timeStem === '甲') ? dutyStem : timeStem;

  // 星伏（純位置）：時干所在地盤宮位 是否＝符頭所在地盤宮位（八星、天盤天干排列同一起點）
  const isStarFrozen = String(timeStemHouse) === String(dutyStemHouse);

  // 門伏（純位置）：值使門落宮 是否＝值使門固定本宮（＝符頭所在地盤宮位）。八門同一起點同一offset，單點檢查即代表全部八門
  const isGateFrozen = String(dutyGateLandHouse) === String(dutyStemHouse);

  // 引干閉環（觸發特例三用，內容檢查，跟門伏的位置檢查是不同條件）：
  // 值使門落宮的地盤干 是否包含 effectiveStem
  const diStemAtLand = earthStemMap[dutyGateLandHouse] || '';
  const isGuidingClosed = diStemAtLand.includes(effectiveStem);

  const isTripleSame = isStarFrozen && isGuidingClosed;

  let guidingMap;
  if (isTripleSame) {
    const stemOrder = EARTH_STEM_ORDER; // 戊己庚辛壬癸丁丙乙
    const walkFull = solsticeType === '陽'
      ? [5,6,7,8,9,1,2,3,4]
      : [5,4,3,2,1,9,8,7,6];

    // 飛布函數：將 centerStem 入中宮飛布，回傳 flyMap（中宮寄坤二前）
    function doFlyRaw(centerStem) {
      const centerIdx = stemOrder.indexOf(centerStem);
      const fm = {};
      for (let i = 0; i < 9; i++) {
        const gan = stemOrder[(centerIdx + i) % 9];
        const gong = walkFull[i];
        fm[gong] = (fm[gong] || '') + gan;
      }
      return fm;
    }

    // 特例三：effectiveStem 入中飛布
    let rawMap = doFlyRaw(effectiveStem);

    // 中宮寄坤二
    if (rawMap[5]) {
      rawMap[2] = (rawMap[2] || '') + rawMap[5];
      delete rawMap[5];
    }

    // 特例四：飛布後值使門落宮引干仍含 effectiveStem → 閉環
    // 改用坤二另一個天干入中飛布
    if ((rawMap[dutyGateLandHouse] || '').includes(effectiveStem)) {
      const otherStem = (rawMap[2] || '').split('').find(c => c !== effectiveStem);
      if (otherStem) {
        rawMap = doFlyRaw(otherStem);
        if (rawMap[5]) {
          rawMap[2] = (rawMap[2] || '') + rawMap[5];
          delete rawMap[5];
        }
      }
    }

    guidingMap = {};
    [1,2,3,4,6,7,8,9].forEach(g => { guidingMap[g] = rawMap[g] || ''; });
  } else {
    // 普通情況：從值使門落宮起，以 effectiveStem 為頭，順時針放入
    let headPos = earthStemSeq.findIndex(s => s.includes(effectiveStem));
    if (headPos === -1) headPos = 0;
    guidingMap = placeInOrder(dutyGateLandHouse, HOUSE_CW, earthStemSeq, headPos);
  }

  return { guidingMap, isStarFrozen, isGateFrozen };
}

const EIGHT_STARS = ['天蓬','天任','天沖','天輔','天英','天芮','天柱','天心'];

// 排八星：地盤時干宮起，值符星為頭，固定蓬任沖輔英芮柱心順時針
function getStarMap(timeStemHouse, dutyStar) {
  const headIdx = EIGHT_STARS.indexOf(dutyStar);
  return placeInOrder(timeStemHouse, HOUSE_CW, EIGHT_STARS, headIdx);
}

// 排天盤天干：地盤時干宮起，沿地盤實際順時針序列從符頭切入，永遠順時針放入
// earthStemSeq：實際順時針讀出的地盤天干序列（8個位置，由呼叫端算好傳入，避免與getHidingStemMap重複計算）
function getHeavenStemMap(timeStemHouse, earthStemSeq, dutyStem) {
  // 找符頭所在位置（位置index）
  const headPos = earthStemSeq.findIndex(s => s.includes(dutyStem));
  return placeInOrder(timeStemHouse, HOUSE_CW, earthStemSeq, headPos);
}

// 排地盤天干
// 回傳 { 宮位數: 天干 }，例如 { 1:'丙', 2:'戊乙', ... }
function getEarthStemMap(solsticeType, chartNum) {
  const result = {};
  const order9 = solsticeType === '陽' ? HOUSE_FLY_ASC : HOUSE_FLY_DESC; // 含5，9格

  // 找戊的起始宮位在9格順序中的 index
  const startIdx = order9.indexOf(chartNum);

  // 9個天干依序排入9格（含中宮5）
  for (let i = 0; i < 9; i++) {
    const gan = EARTH_STEM_ORDER[i];
    const gong = order9[(startIdx + i) % 9];
    if (result[gong]) {
      result[gong] = result[gong] + gan;
    } else {
      result[gong] = gan;
    }
  }
  // 中宮5原始天干（寄坤前），第六步排八門的數字走步需要用這個原始位置
  const houseFiveStem = result[5] || null;

  // 排完後，5宮天干寄坤（2）－ 此為「顯示用／空間旋轉用」的合併版本
  if (result[5]) {
    result[2] = result[2] ? result[2] + result[5] : result[5];
    delete result[5];
  }

  return { earthStemMap: result, houseFiveStem };
}

// 根據時柱干支找旬首資料（用完整干支配對）
function getDecInfo(timeStem, timeBranch) {
  const stemIdx = HEAVEN_STEM_LIST.indexOf(timeStem);
  const branchIdx = EARTH_BRANCH_LIST.indexOf(timeBranch);
  const posInXun = stemIdx; // 在旬中的位置就是天干序號（甲=0, 乙=1, ...）
  const decFirstBranchIdx = (branchIdx - posInXun + 12) % 12;
  const decFirstBranch = EARTH_BRANCH_LIST[decFirstBranchIdx];

  const decMap = {
    '子': { xun: '甲子旬', dutyStem: '戊', voidBranches: ['戌','亥'] },
    '戌': { xun: '甲戌旬', dutyStem: '己', voidBranches: ['申','酉'] },
    '申': { xun: '甲申旬', dutyStem: '庚', voidBranches: ['午','未'] },
    '午': { xun: '甲午旬', dutyStem: '辛', voidBranches: ['辰','巳'] },
    '辰': { xun: '甲辰旬', dutyStem: '壬', voidBranches: ['寅','卯'] },
    '寅': { xun: '甲寅旬', dutyStem: '癸', voidBranches: ['子','丑'] },
  };
  return decMap[decFirstBranch] || null;
}

// 驗證年月日時分是否為合理數字，不合理則標紅對應欄位並顯示訊息
function validateDateInputs(y, m, d, h, min) {
  const fields = [
    { id: 'year', valid: Number.isInteger(y) && y >= 1, msg: '年份須為正整數' },
    { id: 'month', valid: Number.isInteger(m) && m >= 1 && m <= 12, msg: '月份須在1–12之間' },
    { id: 'hour', valid: Number.isInteger(h) && h >= 0 && h <= 23, msg: '時須在0–23之間' },
    { id: 'minute', valid: Number.isInteger(min) && min >= 0 && min <= 59, msg: '分須在0–59之間' },
  ];

  // 日的合理範圍要先確定月份合法才能算當月天數，否則先用31上限粗略檢查
  const daysInMonth = (Number.isInteger(y) && Number.isInteger(m) && m >= 1 && m <= 12)
    ? new Date(y, m, 0).getDate()
    : 31;
  fields.push({ id: 'day', valid: Number.isInteger(d) && d >= 1 && d <= daysInMonth, msg: `日須在1–${daysInMonth}之間` });

  const errorMsgs = [];
  fields.forEach(f => {
    const el = document.getElementById(f.id);
    if (!el) return;
    if (f.valid) {
      el.classList.remove('input-error');
    } else {
      el.classList.add('input-error');
      errorMsgs.push(f.msg);
    }
  });

  const msgEl = document.getElementById('input-error-msg');
  if (msgEl) {
    if (errorMsgs.length) {
      msgEl.textContent = errorMsgs.join('；');
      msgEl.style.display = 'block';
    } else {
      msgEl.textContent = '';
      msgEl.style.display = 'none';
    }
  }

  return errorMsgs.length === 0;
}

function castChart() {
  const y   = parseInt(document.getElementById('year').value);
  const m   = parseInt(document.getElementById('month').value);
  const d   = parseInt(document.getElementById('day').value);
  const h   = parseInt(document.getElementById('hour').value);
  const min = parseInt(document.getElementById('minute').value);

  if (!validateDateInputs(y, m, d, h, min)) {
    return;
  }

  // 重新排盤時清除上一次的長生高亮與宮位高亮，避免底線與標籤殘留舊資料
  _activeChangshengHouse = null;
  _activeChangshengIndex = -1;
  clearChangsheng();
  clearHighlight();
  document.querySelectorAll('.gc-tian .stem-active, .gc-shen .stem-active').forEach(s => s.classList.remove('stem-active'));

  // 子時跨日：23:00-23:59 屬於隔日子時，農曆換算需 +1 天，時辰改為 0
  let lunarD = d, lunarM = m, lunarY = y, lunarH = h;
  if (h === 23) {
    const nextDay = new Date(y, m - 1, d + 1);
    lunarY = nextDay.getFullYear();
    lunarM = nextDay.getMonth() + 1;
    lunarD = nextDay.getDate();
    lunarH = 0;
  }

  const solar = Solar.fromYmdHms(lunarY, lunarM, lunarD, lunarH, min, 0);
  const lunar = solar.getLunar();
  const ec = lunar.getEightChar();

  // 西元
  document.getElementById('sy').textContent = y;
  document.getElementById('sm').textContent = String(m).padStart(2,'0');
  document.getElementById('sd').textContent = String(d).padStart(2,'0');
  document.getElementById('st').textContent = String(h * 100 + min).padStart(4,'0');

  // 農曆
  document.getElementById('ly').textContent = lunar.getYear();
  document.getElementById('lm').textContent = String(Math.abs(lunar.getMonth())).padStart(2,'0');
  document.getElementById('ld').textContent = String(lunar.getDay()).padStart(2,'0');
  document.getElementById('lt').textContent = String(h * 100 + min).padStart(4,'0');

  // 四柱
  const yGZ = ec.getYear();
  const mGZ = ec.getMonth();
  const dGZ = ec.getDay();
  const hGZ = ec.getTime();

  document.getElementById('gz-y-gan').textContent = yGZ[0];
  document.getElementById('gz-y-zhi').textContent = yGZ[1];
  document.getElementById('gz-m-gan').textContent = mGZ[0];
  document.getElementById('gz-m-zhi').textContent = mGZ[1];
  document.getElementById('gz-d-gan').textContent = dGZ[0];
  document.getElementById('gz-d-zhi').textContent = dGZ[1];
  document.getElementById('gz-h-gan').textContent = hGZ[0];
  document.getElementById('gz-h-zhi').textContent = hGZ[1];

  // 陽盤日/月/年盤：旬首/符頭/空亡/馬星/值符值使/引干，改用對應的干支；陰盤與陽盤時盤維持用時干支
  const effGZ = (PLATE_MODE === 'yang' && PLATE_SUBMODE === 'day') ? dGZ
              : (PLATE_MODE === 'yang' && PLATE_SUBMODE === 'month') ? mGZ
              : (PLATE_MODE === 'yang' && PLATE_SUBMODE === 'year') ? yGZ
              : hGZ;

  // 陰陽遁 + 局數
  let solsticeType, chartNum, yangInfo = null;
  if (PLATE_MODE === 'yang') {
    // 年盤／月盤：改用三元甲子公式（見 getYearSanYuanJu／getMonthWuXingJu 註解）；
    // 時家（置閏）：維持沿用9.2節氣表＋9.3置閏引擎
    if (PLATE_SUBMODE === 'year') {
      yangInfo = getYearSanYuanJu(y, m, d, yGZ); // 純mod 180公式，無方向性限制，任何年份皆可算
    } else if (PLATE_SUBMODE === 'month') {
      yangInfo = getMonthWuXingJu(y, m, d, yGZ); // 純mod 15公式，同上
    } else {
      yangInfo = getYangChartNumber(y, m, d); // 時盤：鏈式模擬，僅能從1899-12-22正授錨點往後算
    }
    if (!yangInfo) {
      const msgEl = document.getElementById('input-error-msg');
      if (msgEl) {
        msgEl.textContent = '此日期早於陽盤時家(置閏)已驗證錨點範圍（1899-12-22），暫不支援排盤';
        msgEl.style.display = 'block';
      }
      return;
    }
    solsticeType = yangInfo.solsticeType;
    chartNum = yangInfo.chartNum;
  } else {
    solsticeType = getSolsticeType(y, m, d, h);
    chartNum = getChartNumber(lunar, h, ec);
  }
  document.getElementById('hb-qiju').textContent = solsticeType + chartNum + '局';

  // 排地盤天干
  const { earthStemMap, houseFiveStem } = getEarthStemMap(solsticeType, chartNum);
  // 地盤天干寫入將在後面取得 dutyStemHouse 後統一處理（入墓判定需要）

  // 旬首 / 符頭 / 空亡
  const decInfo = getDecInfo(effGZ[0], effGZ[1]);
  if (decInfo) {
    document.getElementById('hb-xun').textContent = decInfo.xun;
    document.getElementById('hb-dutyStem').textContent = decInfo.dutyStem;
    document.getElementById('hb-voidBranches').textContent = decInfo.voidBranches.join('、');

    // 清除所有 kong 與 ma
    [1,2,3,4,6,7,8,9].forEach(g => {
      const kongEl = document.getElementById('void-' + g);
      if (kongEl) kongEl.innerHTML = '';
      const maEl = document.getElementById('horse-' + g);
      if (maEl) maEl.innerHTML = '';
    });

    // 先計算馬和空的宮位
    const horseZhi = TRAVEL_HORSE_TABLE[effGZ[1]];
    const horseHouse = horseZhi ? BRANCH_TO_HOUSE[horseZhi] : null;

    // 馬先放（放入 horse- 格）
    if (horseHouse) {
      const el = document.getElementById('horse-' + horseHouse);
      if (el) el.innerHTML = '<span class="tag horse"><span>馬</span></span>';
      document.getElementById('hb-travel-horse').textContent = horseZhi;
    }

    // 空後放（空在右）
    const marked = new Set();
    decInfo.voidBranches.forEach(zhi => {
      const g = BRANCH_TO_HOUSE[zhi];
      const el = document.getElementById('void-' + g);
      if (el && !marked.has(g)) {
        el.innerHTML += '<span class="tag void">空</span>';
        marked.add(g);
      }
    });

    // 值符宮：符頭天干在地盤的宮位
    const dutyStemHouse = Object.keys(earthStemMap).find(g => earthStemMap[g].includes(decInfo.dutyStem));

    if (dutyStemHouse) {
      const dutyStar = HOUSE_STAR[dutyStemHouse];
      document.getElementById('hb-zhifu').textContent = dutyStar || '—';
      document.getElementById('hb-zhishi').textContent = HOUSE_GATE[dutyStemHouse] || '—';

      // 地盤時干宮：時柱天干在地盤的宮位
      // 六甲伏吟：時干為甲，甲不在地盤，改用符頭宮位（甲遁伏於值符下）
      let timeStemHouse = Object.keys(earthStemMap).find(g => earthStemMap[g].includes(effGZ[0]));
      if (!timeStemHouse) timeStemHouse = dutyStemHouse;

      if (timeStemHouse) {
        try {
          // 排八神
          const spiritMap = getSpiritMap(timeStemHouse, solsticeType);
          // 排八星
          const starMap = getStarMap(timeStemHouse, dutyStar);
          // 地盤天干序列（實際順時針讀出，8個位置，寄干宮保留兩個天干）－供天盤天干、引干共用，避免重複計算
          const earthStemSeq = HOUSE_CW.map(g => earthStemMap[g] || '');
          // 排天盤天干
          const heavenStemMap = getHeavenStemMap(timeStemHouse, earthStemSeq, decInfo.dutyStem);
          // 排八門：值使門地盤宮位
          // 走步起點需用「寄坤前」的原始宮位──若符頭天干恰為中宮5寄坤前的原始天干，
          // 數字走步（含中宮）的起點應為5本身，不可用已合併到坤2的位置（5與2在九宮數字
          // 循環中是不同的計數站，提前合併會讓起點算錯）
          const dutyStemHouseForGate = (houseFiveStem && decInfo.dutyStem === houseFiveStem) ? 5 : dutyStemHouse;
          const gateMap = getGateMap(dutyStemHouseForGate, solsticeType, effGZ[0]);
          // 找值使門落宮（天盤使門所在宮位）
          const shimenName = HOUSE_GATE[dutyStemHouse];
          const dutyGateLandHouse = Object.keys(gateMap).find(g => gateMap[g] === shimenName);
          // 星反：天蓬落在離9 → 星反成立
          const isStarReversed = Object.keys(starMap).find(g => starMap[g] === '天蓬') === '9';
          // 門反：休門落在離9 → 門反成立
          const isGateReversed = Object.keys(gateMap).find(g => gateMap[g] === '休門') === '9';

          // 排引干
          const guidingResult = dutyGateLandHouse
            ? getHidingStemMap(dutyGateLandHouse, earthStemMap, earthStemSeq, effGZ[0], decInfo.dutyStem, solsticeType, timeStemHouse, dutyStemHouse)
            : { guidingMap: {}, isStarFrozen: false, isGateFrozen: false, isStarReversed: false };
          const hidingStemMap = guidingResult.guidingMap;

          // 伏吟/反吟標記顯示：有伏吟顯示星伏／門伏（標紅）；有反吟顯示星反（標紅）；無則顯示陰盤
          const fuyinEl = document.getElementById('hb-fuyin');
          if (fuyinEl) {
            const labels = [];
            if (guidingResult.isStarFrozen) labels.push('星伏');
            if (guidingResult.isGateFrozen) labels.push('門伏');
            if (isStarReversed) labels.push('星反');
            if (isGateReversed) labels.push('門反');
            if (labels.length) {
              fuyinEl.textContent = labels.join('');
              fuyinEl.style.color = '#c0392b';
            } else {
              fuyinEl.textContent = PLATE_MODE === 'yang'
                ? ('陽盤・' + ({time:'時家',day:'日家',month:'月家',year:'年家'}[PLATE_SUBMODE] || '時家'))
                : '陰盤';
              fuyinEl.style.color = '';
            }
          }

          [1,2,3,4,6,7,8,9].forEach(g => {
            const shenEl = document.getElementById('sh-' + g);
            const starEl = document.getElementById('star-' + g);
            const tianEl = document.getElementById('tian-' + g);
            const gateEl = document.getElementById('gate-' + g);
            const yinEl  = document.getElementById('yin-' + g);
            const diEl   = document.getElementById('di-' + g);
            if (shenEl) shenEl.textContent = spiritMap[g] || '';
            if (starEl) starEl.textContent = starMap[g] || '';
            // 天盤天干（入墓判定，含甲入墓特例）
            if (tianEl) {
              const isDutyHouse = String(g) === String(timeStemHouse);
              tianEl.innerHTML = renderStemHTML(heavenStemMap[g] || '', g, decInfo.dutyStem, isDutyHouse);
            }
            if (gateEl) gateEl.innerHTML = renderGateHTML(gateMap[g] || '', g);
            // 地盤天干（入墓判定，含甲入墓特例）
            if (diEl) {
              const isDutyHouse = String(g) === String(dutyStemHouse);
              diEl.innerHTML = renderStemHTML(earthStemMap[g] || '', g, decInfo.dutyStem, isDutyHouse);
            }
            // 引干（不判定四害）——僅陰盤與陽盤時盤顯示；陽盤日/月/年盤經老師的排盤工具比對確認本來就不顯示引干（非待確認事項）
            const showGuidingStem = !(PLATE_MODE === 'yang' && PLATE_SUBMODE !== 'time');
            if (yinEl) {
              const val = showGuidingStem ? (hidingStemMap[g] || '') : '';
              if (!val) { yinEl.innerHTML = ''; return; }
              if ((g === 3 || g === 7) && val.length > 1) {
                yinEl.innerHTML = val.split('').map(ch => `<span>${ch}</span>`).join('');
              } else {
                yinEl.textContent = val;
              }
            }
          });
        } catch(e) {
          console.log('ERROR:', e.message, e.stack);
        }
      }
    }
  }

  document.getElementById('paipan-result').style.display = 'block';
  // 截圖按鈕只在桌面或 iPad 顯示（手機用系統截圖即可）
  const isIPad = /iPad/.test(navigator.userAgent) ||
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isDesktop = navigator.maxTouchPoints === 0 || isIPad;
  if (isDesktop) {
    document.getElementById('btn-capture-wrap').style.display = 'block';
  }
  document.getElementById('paipan-result').scrollIntoView({ behavior: 'smooth' });

  clearHighlight();
}

// ══════════════════════════════════
// 盤面紀錄（localStorage）
// ══════════════════════════════════
const RECORDS_KEY = 'qimenRecords';
const PREDICTOR_KEY = 'qimenPredictorProfile';

function getPredictorProfile() {
  try { return JSON.parse(localStorage.getItem(PREDICTOR_KEY)) || null; }
  catch { return null; }
}

function setPredictorGender(gender) {
  localStorage.setItem(PREDICTOR_KEY, JSON.stringify({ gender }));
  renderPredictorGender();
}

function renderPredictorGender() {
  const profile = getPredictorProfile();
  document.querySelectorAll('#rec-predictor-gender button').forEach(b => {
    b.classList.toggle('active', !!profile && b.dataset.val === profile.gender);
  });
}

function getRecords() {
  try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || []; }
  catch { return []; }
}

function saveRecords(list) {
  localStorage.setItem(RECORDS_KEY, JSON.stringify(list));
}

function pickChoice(btn) {
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// 案主選擇連動：自測＝面測（日干宮位為主），測法自動帶入並鎖定
function pickClientChoice(btn) {
  pickChoice(btn);
  const isSelf = btn.dataset.val === '自測';
  document.querySelectorAll('#rec-method button').forEach(b => {
    if (isSelf) {
      b.classList.toggle('active', b.dataset.val === '面測');
      b.disabled = b.dataset.val !== '面測';
      b.style.opacity = b.disabled ? '.35' : '';
    } else {
      b.disabled = false;
      b.style.opacity = '';
    }
  });
}

function getChoice(groupId) {
  const el = document.querySelector('#' + groupId + ' button.active');
  return el ? el.dataset.val : null;
}

function currentChartTimeStr() {
  const y  = document.getElementById('year').value;
  const m  = document.getElementById('month').value;
  const d  = document.getElementById('day').value;
  const h  = document.getElementById('hour').value;
  const mn = document.getElementById('minute').value;
  if (!y || !m || !d || h === '' || mn === '') return null;
  return `${y}-${pad(+m)}-${pad(+d)} ${pad(+h)}:${pad(+mn)}`;
}

// 四柱計算核心：套用與 performChart 相同的子時跨日規則，供多處呼叫共用
function computeFourPillars(y, m, d, h, mn) {
  if (!y || !m || !d || isNaN(h) || isNaN(mn)) return null;

  let lunarY = y, lunarM = m, lunarD = d, lunarH = h;
  if (h === 23) {
    const nextDay = new Date(y, m - 1, d + 1);
    lunarY = nextDay.getFullYear();
    lunarM = nextDay.getMonth() + 1;
    lunarD = nextDay.getDate();
    lunarH = 0;
  }

  try {
    const solar = Solar.fromYmdHms(lunarY, lunarM, lunarD, lunarH, mn, 0);
    const ec = solar.getLunar().getEightChar();
    const yGZ = ec.getYear(), mGZ = ec.getMonth(), dGZ = ec.getDay(), hGZ = ec.getTime();
    return `${yGZ}　${mGZ}　${dGZ}　${hGZ}`;
  } catch (e) {
    return null;
  }
}

// 依紀錄存的 chartTime（"YYYY-MM-DD HH:mm"）反推四柱八字，只存 chartTime、不重複存四柱
function fourPillarsFromChartTime(chartTime) {
  const match = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(chartTime || '');
  if (!match) return null;
  const [, y, m, d, h, mn] = match.map(Number);
  return computeFourPillars(y, m, d, h, mn);
}

// 時間＋四柱上下對齊顯示：兩列四欄 grid，數字對齊其下方對應的柱
function buildTimePillarsGrid(chartTime) {
  const match = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(chartTime || '');
  const pillars = fourPillarsFromChartTime(chartTime);
  if (!match || !pillars) return null;
  const cols = pillars.split('　');
  if (cols.length !== 4) return null;
  const dateParts = [match[1], match[2], match[3], `${match[4]}${match[5]}`];
  const topRow = dateParts.map(t => `<span class="tg-date">${t}</span>`).join('');
  const bottomRow = cols.map(p => `<span class="tg-pillar">${p}</span>`).join('');
  return `<div class="tg-wrap"><div class="tg-side"></div><div class="tg-grid">${topRow}${bottomRow}</div><div class="tg-side"></div></div>`;
}

function openRecordsPanel() {
  const t = currentChartTimeStr();
  const timeEl = document.getElementById('rec-chart-time');
  if (t) {
    const timeGrid = buildTimePillarsGrid(t);
    timeEl.innerHTML = timeGrid
      ? `<div class="rec-item-timegrid" style="font-size:14px;color:#333;display:inline-block;text-align:left;">${timeGrid}</div>`
      : t;
  } else {
    timeEl.textContent = '（尚未排盤）';
  }
  renderPredictorGender();
  renderRecordList();
  setRecMsg('', '');
  document.getElementById('records-overlay').classList.add('open');
}

function closeRecordsPanel() {
  document.getElementById('records-overlay').classList.remove('open');
}

function setRecMsg(text, type) {
  const el = document.getElementById('rec-msg');
  el.textContent = text;
  el.className = 'rec-msg' + (type ? ' ' + type : '');
}

function saveRecord() {
  const chartTime = currentChartTimeStr();
  if (!chartTime) { setRecMsg('請先排盤，再儲存紀錄', 'err'); return; }

  const question = document.getElementById('rec-question').value.trim();
  const clientChoice = getChoice('rec-client-gender');
  const method = getChoice('rec-method');

  if (!question) { setRecMsg('請輸入問題描述', 'err'); return; }
  if (!clientChoice) { setRecMsg('請選擇案主（男／女／自測）', 'err'); return; }
  if (!method) { setRecMsg('請選擇測法', 'err'); return; }

  // 預測師性別：第一次使用時需先於「預測師性別」選擇
  const profile = getPredictorProfile();
  if (!profile) {
    setRecMsg('第一次使用，請先在下方「預測師性別」選擇', 'err');
    return;
  }

  const isSelf = clientChoice === '自測';
  const record = {
    id: Date.now(),
    chartTime,
    question,
    clientGender: isSelf ? profile.gender : clientChoice,
    isSelf,
    method,
    predictorGender: profile.gender,
    createdAt: new Date().toISOString()
  };

  const list = getRecords();
  list.unshift(record);
  saveRecords(list);

  document.getElementById('rec-question').value = '';
  document.querySelectorAll('#rec-client-gender button, #rec-method button')
    .forEach(b => { b.classList.remove('active'); b.disabled = false; b.style.opacity = ''; });
  setRecMsg('已儲存', 'ok');
  renderRecordList();
}

// 匯出紀錄：面板內預覽純文字（可複製／下載），非原生對話框
function buildExportText() {
  const list = getRecords();
  return list.map(r => {
    const client = r.isSelf ? '自測' : `案主：${r.clientGender}`;
    const pillars = fourPillarsFromChartTime(r.chartTime);
    const pillarLine = pillars ? `\n${pillars}` : '';
    return `${r.chartTime}${pillarLine}\n${r.question}\n${client}　${r.method}　預測師：${r.predictorGender}`;
  }).join('\n\n');
}

function toggleExportPreview() {
  const box = document.getElementById('export-preview');
  if (box.classList.contains('open')) {
    box.classList.remove('open');
    box.innerHTML = '';
    return;
  }
  const list = getRecords();
  if (!list.length) {
    box.innerHTML = '<div class="export-preview-msg" style="color:#bbb;">尚無紀錄可匯出</div>';
    box.classList.add('open');
    return;
  }
  const text = buildExportText();
  box.innerHTML = `
    <pre id="export-text">${escapeHtml(text)}</pre>
    <div class="export-preview-actions">
      <button onclick="copyExportText()">複製</button>
      <button onclick="downloadExportText()">下載文字檔</button>
    </div>
    <div class="export-preview-msg" id="export-preview-msg"></div>
  `;
  box.classList.add('open');
}

function copyExportText() {
  const text = document.getElementById('export-text').textContent;
  const msg = document.getElementById('export-preview-msg');
  navigator.clipboard.writeText(text)
    .then(() => { msg.textContent = '已複製到剪貼簿'; })
    .catch(() => { msg.textContent = '複製失敗，請手動選取文字複製'; msg.style.color = '#c0392b'; });
}

function downloadExportText() {
  const text = document.getElementById('export-text').textContent;
  const dateStr = new Date().toISOString().slice(0, 10);
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `qimen-records-${dateStr}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const msg = document.getElementById('export-preview-msg');
  if (msg) msg.textContent = '已下載檔案';
}

function renderRecordList() {
  const list = getRecords();
  const wrap = document.getElementById('rec-list');
  if (!list.length) {
    wrap.innerHTML = '<div class="rec-empty">尚無紀錄</div>';
    return;
  }
  wrap.innerHTML = list.map(r => {
    const client = r.isSelf ? '自測' : `案主：${r.clientGender}`;
    const timeGrid = buildTimePillarsGrid(r.chartTime);
    const timeHtml = timeGrid
      ? `<div class="rec-item-timegrid">${timeGrid}</div>`
      : `<div class="rec-item-time">${r.chartTime}</div>`;
    return `<div class="rec-item" id="rec-item-${r.id}">
      ${timeHtml}
      <div class="rec-item-q">${escapeHtml(r.question)}</div>
      <div class="rec-item-meta">${client}　${r.method}　預測師：${r.predictorGender}</div>
      <div class="rec-item-actions">
        <button onclick="askLoadRecord(${r.id})">載入盤面</button>
        <button class="rec-del" onclick="askDeleteRecord(${r.id})">刪除</button>
      </div>
      <div class="rec-item-confirm" id="rec-confirm-${r.id}"></div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[c]);
}

function clearAllConfirms() {
  document.querySelectorAll('.rec-item-confirm').forEach(el => el.innerHTML = '');
}

function askLoadRecord(id) {
  clearAllConfirms();
  const el = document.getElementById('rec-confirm-' + id);
  if (!el) return;
  el.innerHTML = `<div style="margin-top:6px;padding:8px;background:#f7f5f2;border-radius:4px;font-size:12px;color:#555;">
    載入此盤面？目前盤面將被切換。
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button onclick="loadRecord(${id})" style="padding:3px 14px;border:none;border-radius:14px;background:#444;color:#fff;font-family:inherit;font-size:12px;cursor:pointer;">確認載入</button>
      <button onclick="clearAllConfirms()" style="padding:3px 14px;border:1px solid #ddd;border-radius:14px;background:#fff;color:#666;font-family:inherit;font-size:12px;cursor:pointer;">取消</button>
    </div>
  </div>`;
}

function loadRecord(id) {
  const r = getRecords().find(x => x.id === id);
  if (!r) return;
  const m = r.chartTime.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/);
  if (!m) return;
  document.getElementById('year').value = m[1];
  document.getElementById('month').value = m[2];
  document.getElementById('day').value = m[3];
  document.getElementById('hour').value = m[4];
  document.getElementById('minute').value = m[5];
  closeRecordsPanel();
  clearHighlight();
  castChart();
}

function askDeleteRecord(id) {
  clearAllConfirms();
  const el = document.getElementById('rec-confirm-' + id);
  if (!el) return;
  el.innerHTML = `<div style="margin-top:6px;padding:8px;background:#faf3f2;border-radius:4px;font-size:12px;color:#a33;">
    確定刪除此筆紀錄？
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button onclick="deleteRecord(${id})" style="padding:3px 14px;border:none;border-radius:14px;background:#c0392b;color:#fff;font-family:inherit;font-size:12px;cursor:pointer;">確認刪除</button>
      <button onclick="clearAllConfirms()" style="padding:3px 14px;border:1px solid #ddd;border-radius:14px;background:#fff;color:#666;font-family:inherit;font-size:12px;cursor:pointer;">取消</button>
    </div>
  </div>`;
}

function deleteRecord(id) {
  saveRecords(getRecords().filter(x => x.id !== id));
  renderRecordList();
}
